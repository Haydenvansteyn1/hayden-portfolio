<style>
body{margin:0}
*{cursor:url(/media/a2383112dfd4f28913343266fa46f279.png) 6 6, auto !important}
a{color:#2B2722;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.orn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border:1px solid #2B2722;outline:1px solid #2B2722;outline-offset:3px;border-radius:1px;font-family:'EB Garamond',serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#2B2722;white-space:nowrap;transition:background .25s ease,color .25s ease;background:#F2EADB}
.orn:before,.orn:after{content:"";position:absolute;top:50%;width:7px;height:7px;background:#F2EADB;border:1px solid #2B2722;transform:translateY(-50%) rotate(45deg)}
.orn:before{left:-9px}.orn:after{right:-9px}
.orn:hover{background:#2B2722;color:#F2EADB}
.navl{position:relative}
.navl:after{content:"";position:absolute;left:0;right:100%;bottom:-4px;height:1px;background:currentColor;transition:right .25s ease}
.navl:hover:after{right:0}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.plate{position:relative;background:#FBF8F1;border:1px solid rgba(43,39,34,.28);box-shadow:0 1px 0 rgba(43,39,34,.08)}
.plate img.mx{mix-blend-mode:multiply}
.card{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.card:hover{transform:translateY(-4px)}
.card:hover .go{background:#2B2722;color:#F2EADB}
.row:hover{background:rgba(46,111,115,.06)}
.hs{position:absolute;border:1px dashed transparent;background:transparent;padding:0;transition:border-color .2s ease,background .2s ease}
.hs:hover,.hs.on{border-color:var(--acc);background:rgba(46,111,115,.07)}
.leg:hover,.leg.on{background:rgba(46,111,115,.08)}

.screw{position:absolute;width:26px;height:26px;border-radius:50%;padding:0;border:1px solid #6B655C;background:radial-gradient(circle at 35% 30%,#FFFFFF 0 12%,#D9D4CA 45%,#9C968C 100%);box-shadow:0 2px 3px rgba(43,39,34,.35);transition:transform .7s cubic-bezier(.3,1.4,.5,1);z-index:3}
.screw:before,.screw:after{content:"";position:absolute;left:50%;top:50%;background:#5E584F;border-radius:1px}
.screw:before{width:14px;height:2.4px;transform:translate(-50%,-50%)}
.screw:after{width:2.4px;height:14px;transform:translate(-50%,-50%)}
.shopplate{transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
video{display:block}
.vtoggle{border:1px solid #2B2722;background:transparent;padding:8px 13px}
.vtoggle.on{background:#2B2722;color:#F2EADB}

.req{display:grid;grid-template-columns:1.7fr 1fr 1.3fr 90px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(43,39,34,.3)}
.rq{font-family:'EB Garamond',serif;font-size:18px}
.rt{font-size:12px}
.rr{font-family:'EB Garamond',serif;font-size:17px}
.rr.todo{color:#A39C90;font-style:italic}
.st{justify-self:end;font-size:10px;padding:4px 8px;border:1px solid rgba(43,39,34,.3);color:#8A8378}
.st.met{border-color:var(--acc);background:var(--acc);color:#F2EADB}
.leg{display:flex;align-items:center;gap:16px;padding:12px;border-bottom:1px solid rgba(43,39,34,.3)}
.ln{font-size:12px;width:22px;color:#6B655C}
.lt{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:21px;display:block;line-height:1.1}
.lm{font-size:9.5px;color:#6B655C}
.team{font-size:9.5px;padding:4px 8px;border:1px solid rgba(43,39,34,.35);color:#6B655C}
.mineTag{font-size:9.5px;padding:4px 8px;background:var(--acc);color:#F2EADB}
.mine{color:var(--acc)}
.cap{margin-top:12px;display:flex;gap:12px;font-family:'EB Garamond',serif;font-size:16px;line-height:1.4;color:#3A352F}
.acc{color:var(--acc)}
.step{padding:0 18px 0 0}
.sh{display:flex;align-items:center;gap:8px}
.dia{width:9px;height:9px;transform:rotate(45deg);margin-top:-5px;background:#F2EADB;border:1px solid #2B2722}
.dia.on{background:var(--acc)}
.sp{height:170px;margin-top:14px;overflow:hidden}
.stx{margin:12px 0 0;font-family:'EB Garamond',serif;font-size:15.5px;line-height:1.4;color:#3A352F}
.crow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(43,39,34,.3);font-family:'EB Garamond',serif;font-size:18px}
.lvl{font-size:9.5px;padding:5px 10px;background:var(--acc);color:#F2EADB;min-width:86px;text-align:center}
.lvl.soft{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.tag{border:1px solid rgba(43,39,34,.5);padding:6px 10px;font-size:10px}
.vtoggle{border:1px solid #2B2722;background:rgba(251,248,241,.8);padding:9px 16px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fadein{animation:fadein .35s ease both}
</style>
